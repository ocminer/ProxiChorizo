services:
  miner:
    image: ocminersupr/proxichorizo:2.1.1
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      TOKEN: "YOUR_POOL_TOKEN"
      WORKER: "rig1"
      # POOL_URL defaults to stratum+tcp://proxi.suprnova.cc:3355
      # DEVICES: "0"
      # EXTRA_ARGS: "--no-autotune"
    ports:
      - "4078:4078"   # statistics JSON (/) and the mmpOS line (/mmpos)
