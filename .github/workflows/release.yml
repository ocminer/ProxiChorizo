name: release
# Builds ProxiChorizo for Linux (glibc 2.31: any distro, HiveOS, MMPOS, SMOS) and Windows (MSVC),
# packages the archives with checksums, pushes the Docker image, and publishes the GitHub release
# of the tag with RELEASE-v<version>.md as its notes. Trigger: push a tag v<version>; the tag must
# match PX_VERSION in proxichorizo.cu. workflow_dispatch builds artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: version label for a manual (non-release) build
        default: dev
permissions:
  contents: write
  packages: write
env:
  ARCHS: -gencode arch=compute_75,code=sm_75 -gencode arch=compute_80,code=sm_80 -gencode arch=compute_86,code=sm_86 -gencode arch=compute_89,code=sm_89 -gencode arch=compute_120,code=sm_120 -gencode arch=compute_120,code=compute_120
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VER=${GITHUB_REF#refs/tags/v}; else VER="${{ inputs.version }}"; fi
          SRC=$(grep -oP '#define PX_VERSION "\K[^"]+' proxichorizo.cu)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$VER" == "$SRC" ]] || { echo "tag $VER != PX_VERSION $SRC"; exit 1; }
            [[ -f "RELEASE-v$VER.md" ]] || { echo "RELEASE-v$VER.md missing"; exit 1; }
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: exposure check
        run: scripts/check-secrets.sh --all

  linux:
    needs: version
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.9.1-devel-ubuntu20.04
    steps:
      - name: tools
        run: apt-get update -qq && apt-get install -y -qq git binutils >/dev/null
      - uses: actions/checkout@v4
      - name: build (glibc 2.31, Turing to Blackwell)
        run: |
          git config --global --add safe.directory "$PWD"
          nvcc --version | tail -2
          nvcc -O3 -std=c++17 $ARCHS -Xcompiler -static-libstdc++ -Xcompiler -static-libgcc -o proxichorizo proxichorizo.cu -lpthread
          objdump -T proxichorizo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: package
        run: scripts/package.sh "${{ needs.version.outputs.ver }}" ./proxichorizo 12.9
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.9.0'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          method: network
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: build
        shell: cmd
        run: nvcc -O3 -std=c++17 %ARCHS% -Xcompiler /MT -o proxichorizo.exe proxichorizo.cu
      - name: package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version "${{ needs.version.outputs.ver }}" -Exe proxichorizo.exe -Cuda 12.9
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: registry
        id: reg
        env: { DH_USER: "${{ secrets.DOCKERHUB_USERNAME }}" }
        run: |
          if [[ -n "$DH_USER" ]]; then echo "tags=ocminersupr/proxichorizo:${{ needs.version.outputs.ver }},ocminersupr/proxichorizo:latest,ghcr.io/${{ github.repository_owner }}/proxichorizo:${{ needs.version.outputs.ver }},ghcr.io/${{ github.repository_owner }}/proxichorizo:latest" >> "$GITHUB_OUTPUT"; echo "dockerhub=true" >> "$GITHUB_OUTPUT";
          else echo "tags=ghcr.io/${{ github.repository_owner }}/proxichorizo:${{ needs.version.outputs.ver }},ghcr.io/${{ github.repository_owner }}/proxichorizo:latest" >> "$GITHUB_OUTPUT"; echo "dockerhub=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@v3
        if: steps.reg.outputs.dockerhub == 'true'
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.reg.outputs.tags }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: checksums
        run: cd dist && cat *.sha256 > SHA256SUMS && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          name: ProxiChorizo ${{ needs.version.outputs.ver }}
          body_path: RELEASE-v${{ needs.version.outputs.ver }}.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
