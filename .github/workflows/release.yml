name: release
# Builds ProxiChorizo for Linux (glibc 2.31: any distro, HiveOS, MMPOS, SMOS) and Windows (MSVC),
# packages the archives with checksums, pushes the Docker image, and publishes the GitHub release
# of the tag with RELEASE-v<version>.md as its notes. Trigger: push a tag v<version>; the tag must
# match PX_VERSION in proxichorizo.cu. workflow_dispatch builds artifacts without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: source version for a manual build (dev uses PX_VERSION)
        default: dev
permissions:
  contents: write
  packages: write
  actions: read   # download-artifact v4 lists artifacts through the Actions API
env:
  ARCHS: -gencode arch=compute_75,code=sm_75 -gencode arch=compute_80,code=sm_80 -gencode arch=compute_86,code=sm_86 -gencode arch=compute_89,code=sm_89 -gencode arch=compute_90,code=sm_90 -gencode arch=compute_120,code=sm_120 -gencode arch=compute_120,code=compute_120
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { REQUESTED_VERSION: "${{ inputs.version }}" }
        run: |
          SRC=$(grep -oP '#define PX_VERSION "\K[^"]+' proxichorizo.cu)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER=${GITHUB_REF#refs/tags/v}
          else
            VER=${REQUESTED_VERSION:-dev}
            [[ "$VER" != dev ]] || VER=$SRC
          fi
          [[ "$VER" == "$SRC" ]] || { echo "version $VER != PX_VERSION $SRC"; exit 1; }
          [[ -f "RELEASE-v$VER.md" ]] || { echo "RELEASE-v$VER.md missing"; exit 1; }
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: exposure check
        run: scripts/check-secrets.sh --all
      - name: draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER=${GITHUB_REF#refs/tags/v}
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --draft --title "ProxiChorizo $VER" --notes-file "RELEASE-v$VER.md"

  linux:
    needs: version
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.9.1-devel-ubuntu20.04
    steps:
      - name: tools
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git binutils python3 ocl-icd-opencl-dev opencl-headers >/dev/null
      - uses: actions/checkout@v4
      - name: build (glibc 2.31, Turing to Blackwell)
        run: |
          git config --global --add safe.directory "$PWD"
          nvcc --version | tail -2
          nvcc -O3 -std=c++17 $ARCHS -Xcompiler -static-libstdc++ -Xcompiler -static-libgcc -o proxichorizo proxichorizo.cu -lpthread -ldl
          objdump -T proxichorizo | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - name: build the OpenCL miner (AMD)
        run: |
          make -C opencl proxichorizo-cl CL_INC=/usr/include CL_LIB=/usr/lib/x86_64-linux-gnu CXXFLAGS="-O2 -std=c++17 -Wall -Wno-unused-function -I/usr/include -static-libstdc++ -static-libgcc"
          objdump -T opencl/proxichorizo-cl | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          ldd opencl/proxichorizo-cl | grep -i opencl
      - name: CPU regression checks
        run: |
          g++ -std=c++17 -O2 tests/platform_profiles.cpp -o /tmp/test-platform-profiles
          /tmp/test-platform-profiles
          make -C opencl test-profiles CL_INC=/usr/include CL_LIB=/usr/lib/x86_64-linux-gnu
          python3 scripts/test-launchers.py
          ./proxichorizo --help
          ./opencl/proxichorizo-cl --help
      - name: stratum and stratum+ssl against the live pool (system OpenSSL, no GPU)
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates libssl1.1 >/dev/null
          for u in stratum+tcp://proxi.suprnova.cc:3355 stratum+ssl://proxi.suprnova.cc:3356; do ./proxichorizo --check-pool $u; ./opencl/proxichorizo-cl --check-pool $u; done
      - name: package
        run: scripts/package.sh "${{ needs.version.outputs.ver }}" ./proxichorizo 12.9 opencl/proxichorizo-cl
      - name: verify packaged notices and checksums
        run: python3 scripts/verify-release.py --version "${{ needs.version.outputs.ver }}" dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*, if-no-files-found: error }
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          apt-get install -y -qq curl >/dev/null; curl -sL https://github.com/cli/cli/releases/download/v2.67.0/gh_2.67.0_linux_amd64.tar.gz | tar xz --strip-components=2 -C /usr/local/bin gh_2.67.0_linux_amd64/bin/gh
          gh release upload "v${{ needs.version.outputs.ver }}" dist/* --clobber

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.9.0'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          method: network
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: build
        shell: cmd
        run: nvcc -O3 -std=c++17 %ARCHS% -Xcompiler /MT -o proxichorizo.exe proxichorizo.cu
      - name: OpenSSL 3 for the package (stratum+ssl)
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\OpenSSL\bin\libssl-3-x64.dll') -and !(Test-Path 'C:\Program Files\OpenSSL-Win64\bin\libssl-3-x64.dll')) { choco install openssl -y --no-progress }
          Get-ChildItem 'C:\Program Files\OpenSSL*\bin\lib*-3-x64.dll' | ForEach-Object FullName
      - name: package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version "${{ needs.version.outputs.ver }}" -Exe proxichorizo.exe -Cuda 12.9
      - name: verify packaged notices and checksums
        shell: pwsh
        run: python scripts/verify-release.py --version "${{ needs.version.outputs.ver }}" (Get-ChildItem dist/*.zip | ForEach-Object FullName)
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*, if-no-files-found: error }
      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "v${{ needs.version.outputs.ver }}" (Get-ChildItem dist/* | ForEach-Object FullName) --clobber

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: registry
        id: reg
        env: { DH_USER: "${{ secrets.DOCKERHUB_USERNAME }}" }
        run: |
          if [[ -n "$DH_USER" ]]; then echo "tags=ocminersupr/proxichorizo:${{ needs.version.outputs.ver }},ocminersupr/proxichorizo:latest,ghcr.io/${{ github.repository_owner }}/proxichorizo:${{ needs.version.outputs.ver }},ghcr.io/${{ github.repository_owner }}/proxichorizo:latest" >> "$GITHUB_OUTPUT"; echo "dockerhub=true" >> "$GITHUB_OUTPUT";
          else echo "tags=ghcr.io/${{ github.repository_owner }}/proxichorizo:${{ needs.version.outputs.ver }},ghcr.io/${{ github.repository_owner }}/proxichorizo:latest" >> "$GITHUB_OUTPUT"; echo "dockerhub=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@v3
        if: steps.reg.outputs.dockerhub == 'true'
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.reg.outputs.tags }}
      - name: verify actual container contents
        env: { RELEASE_VERSION: "${{ needs.version.outputs.ver }}", IMAGE_TAGS: "${{ steps.reg.outputs.tags }}" }
        run: |
          IMAGE="${IMAGE_TAGS%%,*}"
          CID=$(docker create --entrypoint /bin/true "$IMAGE")
          trap 'docker rm -f "$CID" >/dev/null' EXIT
          mkdir image-check
          docker cp "$CID:/app/." image-check/
          python3 scripts/verify-release.py --version "$RELEASE_VERSION" --directory image-check
          docker run --rm --entrypoint /app/proxichorizo "$IMAGE" --help > image-help.txt 2>&1
          grep -F "ProxiChorizo $RELEASE_VERSION" image-help.txt
      - name: publish verified container images
        if: startsWith(github.ref, 'refs/tags/v')
        env: { IMAGE_TAGS: "${{ steps.reg.outputs.tags }}" }
        run: |
          IFS=',' read -ra TAGS <<< "$IMAGE_TAGS"
          for TAG in "${TAGS[@]}"; do docker push "$TAG"; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows, docker]
    runs-on: ubuntu-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - name: checksums and publish
        run: |
          VER="${{ needs.version.outputs.ver }}"
          mkdir dist && gh release download "v$VER" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir dist
          cat dist/*.sha256 > dist/SHA256SUMS && cat dist/SHA256SUMS
          gh release upload "v$VER" --repo "$GITHUB_REPOSITORY" dist/SHA256SUMS --clobber
          gh release edit "v$VER" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
